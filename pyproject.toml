[project]
name = "flight-aqi-spatial-join"
version = "0.1.0"
description = "Global Real-Time Flight & Air Quality Spatial Join Pipeline on GCP"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "shapely>=2.0.4",
    "apache-beam[gcp]>=2.56.0",
    "google-cloud-pubsub>=2.21.0",
    "google-cloud-bigquery>=3.25.0",
    "streamlit>=1.35.0",
    "pydeck>=0.9.1",
    "loguru>=0.7.3",
    "httpx2[cli]>=2.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "pre-commit>=4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
