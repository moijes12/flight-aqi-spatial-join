[project]
name = "flight-aqi-spatial-join"
version = "0.1.0"
description = "Global Real-Time Flight & Air Quality Spatial Join Pipeline on GCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apache-beam>=2.77.0",
    "db-dtypes>=1.2.0",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-pubsub>=2.43.0",
    "httpx>=0.27.0",
    "httpx2[cli]>=2.16.0",
    "loguru>=0.7.3",
    "pydantic>=2.14.3",
    "pydeck>=0.9.3",
    "shapely>=2.0.4",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
