steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/flight-aqi-worker:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/flight-aqi-worker:latest
      - .
  - id: Push commit
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/flight-aqi-worker:$COMMIT_SHA
  - id: Push latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/flight-aqi-worker:latest
  - id: Deploy job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - flight-aqi-worker
      - --image=gcr.io/$PROJECT_ID/flight-aqi-worker:$COMMIT_SHA
      - --region=us-central1
      - --quiet
images:
  - gcr.io/$PROJECT_ID/flight-aqi-worker:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/flight-aqi-worker:latest
options:
  logging: CLOUD_LOGGING_ONLY
