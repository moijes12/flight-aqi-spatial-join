name: CI
run-name: Run triggerred by ${{github.actor}}
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  build-lint-test:
    name: Lint, Typecheck and test (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff linter (Ruff)
        run: uv run ruff check .

      - name: Run typechecker (Mypy)
        run: uv run mypy src/ # Add packages/ later

      - name: Run tests
        run: uv run pytest tests/
